<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 54" width="100%" height="54">
  <defs>
    <style>
      .bg { fill: #0b0b0e; }
      .frame { fill: none; stroke: #24242c; stroke-width: 1; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .label { font-size: 10.5px; fill: #71717a; letter-spacing: 1.2px; }
      .val { font-size: 10.5px; fill: #d2738a; letter-spacing: 1px; }
      .cyan { fill: #63c5ff; }
      .wave {
        fill: none;
        stroke: #d2738a;
        stroke-width: 1.4;
        stroke-dasharray: 8 4;
        animation: dash 8s linear infinite;
      }
      .dot {
        animation: blink 1.8s infinite ease-in-out;
      }
      @keyframes dash {
        to { stroke-dashoffset: -120; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
    </style>
  </defs>
  <rect width="840" height="54" rx="4" class="bg"/>
  <rect x="0.5" y="0.5" width="839" height="53" rx="4" class="frame"/>

  <circle cx="18" cy="27" r="3.5" fill="#63c5ff" class="dot"/>
  <text x="30" y="30.5" class="mono label">NAVI // LAYER 07 TELEMETRY</text>

  <!-- Animated 60Hz Powerline Hum Waveform -->
  <path d="M 250 27 Q 265 12, 280 27 T 310 27 T 340 27 T 370 27 T 400 27 T 430 27 T 460 27 T 490 27 T 520 27 T 550 27 T 580 27" class="wave"/>

  <text x="822" y="30.5" text-anchor="end" class="mono val">SIGNAL : 60Hz HUM // SYNCED ■</text>
</svg>
