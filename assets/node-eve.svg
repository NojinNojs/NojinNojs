<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 144" width="420" height="144">
  <defs>
    <style>
      .bg { fill: #09090d; }
      .hdr { fill: #111118; }
      .ftr { fill: #0d0d14; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .node-tag { font-size: 10px; fill: #a1a1aa; letter-spacing: 0.8px; font-weight: 600; }
      .open-tag { font-size: 10px; fill: #63c5ff; letter-spacing: 0.6px; font-weight: 600; }
      .title { font-size: 18px; font-weight: 700; fill: #f4f4f5; letter-spacing: -0.2px; }
      .desc { font-size: 12.2px; fill: #d4d4d8; }
      .desc2 { font-size: 11.8px; fill: #a1a1aa; }
      .lang { font-size: 11.5px; fill: #e4e4e7; font-weight: 600; }
      .pill-txt { font-size: 10px; fill: #a1a1aa; }
    </style>
  </defs>

  <rect width="420" height="144" rx="5" class="bg"/>
  <rect x="1" y="1" width="418" height="26" rx="4" class="hdr"/>
  <line x1="1" y1="27" x2="419" y2="27" stroke="#22222c" stroke-width="1"/>
  <circle cx="15" cy="14" r="3.2" fill="#4ade80"/>
  <text x="25" y="17.5" class="mono node-tag">03 // EVE-DED-TRACKER</text>
  <text x="404" y="17.5" text-anchor="end" class="mono open-tag">OPEN REPO ↗</text>

  <!-- Right-Aligned Wireframe Emblem (flush with x=404 right margin) -->
  <g transform="translate(364, 36)" opacity="0.28">
    <circle cx="21" cy="20" r="15" fill="none" stroke="#63c5ff" stroke-width="1.8"/><circle cx="21" cy="20" r="7" fill="none" stroke="#d2738a" stroke-width="1.5"/><line x1="21" y1="1" x2="21" y2="39" stroke="#63c5ff" stroke-width="1.2"/><line x1="2" y1="20" x2="40" y2="20" stroke="#63c5ff" stroke-width="1.2"/>
  </g>

  <text x="16" y="53" class="mono title">eve-ded-tracker</text>
  <text x="16" y="75" class="sans desc">Loot and profit tracker for EVE Online runs.</text>
  <text x="16" y="94" class="sans desc2">Logs drops, calculates net ISK per run, and syncs via Supabase.</text>

  <rect x="1" y="108" width="418" height="35" rx="4" class="ftr"/>
  <line x1="1" y1="108" x2="419" y2="108" stroke="#22222c" stroke-width="1"/>
  <circle cx="20" cy="123" r="4.5" fill="#3178c6"/>
  <text x="31" y="127" class="mono lang">TypeScript</text>
  <rect x="337.2" y="114" width="66.8" height="18" rx="3" fill="#161622" stroke="#262636" stroke-width="1"/>
  <text x="370.6" y="126.5" text-anchor="middle" class="mono pill-txt">supabase</text>
  <rect x="297.4" y="114" width="33.8" height="18" rx="3" fill="#161622" stroke="#262636" stroke-width="1"/>
  <text x="314.3" y="126.5" text-anchor="middle" class="mono pill-txt">bun</text>
  <rect x="231.2" y="114" width="60.2" height="18" rx="3" fill="#161622" stroke="#262636" stroke-width="1"/>
  <text x="261.3" y="126.5" text-anchor="middle" class="mono pill-txt">next.js</text>

  <rect x="0.5" y="0.5" width="419" height="143" rx="5" fill="none" stroke="#22222c" stroke-width="1"/>
</svg>
