<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="100%" height="240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Background & Pixel Grid -->
  <rect width="960" height="240" rx="14" fill="url(#bg)"/>
  <rect width="960" height="240" rx="14" fill="url(#grid)"/>
  <rect x="1" y="1" width="958" height="238" rx="13" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Top Terminal Chrome -->
  <rect x="28" y="22" width="904" height="32" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="48" cy="38" r="5" fill="#ef4444"/>
  <circle cx="66" cy="38" r="5" fill="#f59e0b"/>
  <circle cx="84" cy="38" r="5" fill="#22c55e"/>
  <text x="108" y="42" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600">nojin@nixos-hq ~ $ whoami --verbose</text>
  <text x="914" y="42" text-anchor="end" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">JKT · UTC+7 · NixOS 26.05</text>

  <!-- Left Identity Block -->
  <text x="44" y="106" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">Nojin</text>
  <text x="172" y="106" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="22" font-weight="600">@NojinNojs</text>

  <text x="44" y="138" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="500">Full-Stack Web &amp; Systems Developer · Muhammad Raffi Aqsan</text>
  <text x="44" y="164" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">TypeScript · Rust · Astro · Next.js · Laravel 12 · Bun · Pixel-Art TUI &amp; Web Engines</text>

  <!-- Bottom Status Pills -->
  <g transform="translate(44, 184)">
    <rect x="0" y="0" width="164" height="28" rx="6" fill="#052e16" stroke="#166534" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#22c55e"/>
    <text x="28" y="18" fill="#86efac" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600">Open to Collaborate</text>

    <rect x="176" y="0" width="212" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="190" y="18" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">Former Intern @ <tspan fill="#e2e8f0" font-weight="600">BRIN</tspan></text>

    <rect x="400" y="0" width="236" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="414" y="18" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">Portfolio: <tspan fill="#38bdf8" font-weight="600">aqsan-dev.vercel.app</tspan></text>
  </g>

  <!-- Right Pixel-Art Terminal Telemetry Box -->
  <g transform="translate(700, 72)">
    <rect x="0" y="0" width="232" height="140" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
    <text x="16" y="26" fill="#22c55e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700">▸ ACTIVE STACK</text>
    <text x="16" y="50" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">Web   <tspan fill="#f8fafc">Next.js · Astro · React</tspan></text>
    <text x="16" y="70" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">Back  <tspan fill="#f8fafc">Bun · Laravel 12 · Hono</tspan></text>
    <text x="16" y="90" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">Sys   <tspan fill="#f8fafc">Rust · Ratatui · Docker</tspan></text>
    <text x="16" y="110" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">Data  <tspan fill="#f8fafc">Postgres · SQLite WAL</tspan></text>
    <rect x="16" y="124" width="200" height="4" rx="2" fill="url(#accent)"/>
  </g>
</svg>
